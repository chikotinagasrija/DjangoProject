name: Django CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
          SECRET_KEY: test-secret-key
          DB_NAME: testdb
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py check

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
          SECRET_KEY: test-secret-key
          DB_NAME: testdb
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
          SECRET_KEY: test-secret-key
          DB_NAME: testdb
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py test

      - name: Install linting tool
        run: |
          pip install flake8

      - name: Run lint
        run: |
         flake8 . --exclude=.git,venv,__pycache__,staticfiles,media,logs,migrations --select=E9,F63,F7,F82

      - name: Build production Docker image
        run: |
          docker build \
            -t django-backend:${{ github.sha }} \
            -t django-backend:latest \
            .
            
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GitHub Container Registry
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/django-backend

          docker tag django-backend:${{ github.sha }} $IMAGE_NAME:${{ github.sha }}
          docker tag django-backend:${{ github.sha }} $IMAGE_NAME:latest

          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest